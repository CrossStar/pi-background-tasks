<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1000 460">
  <title id="title">pi-background-tasks architecture</title>
  <desc id="desc">Pi commands and tools start background shell commands or attested Pi runs through a shared registry. The registry supplies logs, task status, completion notifications, and the task monitor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#64ecff" stroke-width="2"/></marker>
    <style>
      .node{fill:#0b2848;stroke:#64ecff;stroke-width:2}.label{font:700 22px system-ui,sans-serif;fill:#eefbff;text-anchor:middle}.detail{font:16px system-ui,sans-serif;fill:#a9c7d8;text-anchor:middle}.line{fill:none;stroke:#64ecff;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="460" rx="24" fill="#061529"/>
  <rect class="node" x="30" y="55" width="240" height="100" rx="16"/>
  <text class="label" x="150" y="95">Pi session</text>
  <text class="detail" x="150" y="125">commands · tools · EventBus</text>
  <path class="line" d="M270 105H370"/>
  <rect class="node" x="370" y="55" width="260" height="100" rx="16"/>
  <text class="label" x="500" y="95">Background registry</text>
  <text class="detail" x="500" y="125">lifecycle · reload · cancellation</text>
  <path class="line" d="M630 105H730"/>
  <rect class="node" x="730" y="55" width="240" height="100" rx="16"/>
  <text class="label" x="850" y="95">Child processes</text>
  <text class="detail" x="850" y="125">shell commands · attested Pi</text>
  <path class="line" d="M500 155V265"/>
  <rect class="node" x="270" y="265" width="460" height="125" rx="16"/>
  <text class="label" x="500" y="305">Task monitor and completion delivery</text>
  <text class="detail" x="500" y="338">status · bounded log reads · output files</text>
  <text class="detail" x="500" y="365">metadata · notifications · optional follow-up turn</text>
</svg>
